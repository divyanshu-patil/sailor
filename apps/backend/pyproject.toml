[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.69.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.14.0",
    "groq>=1.5.0",
    "ollama>=0.6.2",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Document text extraction. No stdlib equivalent for any of these formats,
    # and all three are pure-Python with no system packages behind them.
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "supabase>=2.31.0",
    "svix>=1.96.1",
    "uvicorn>=0.48.0",
    "boto3>=1.43.102",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Several packages under app/ have no __init__.py; without this, a module no
# test imports is silently left out of the total instead of counted as 0%.
include_namespace_packages = true
show_missing = true
skip_covered = true
