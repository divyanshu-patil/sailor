[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.69.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.14.0",
    "groq>=1.5.0",
    "ollama>=0.6.2",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Document text extraction. No stdlib equivalent for any of these formats,
    # and all three are pure-Python with no system packages behind them.
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "supabase>=2.31.0",
    "svix>=1.96.1",
    "uvicorn>=0.48.0",
    "boto3>=1.43.102",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Several packages under app/ have no __init__.py; without this, a module no
# test imports is silently left out of the total instead of counted as 0%.
include_namespace_packages = true
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Correctness, not style: pyflakes, pycodestyle errors/warnings and bugbear.
# Formatting (line length, import order) is left to the formatter.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line length is the formatter's business
    "E712",  # `== False` is how SQLAlchemy filters are written
    "B904",  # the app raises HTTPExceptions from except blocks on purpose; chaining
             # would only add the internal cause to tracebacks, not change behaviour
    "B905",  # zip() over lists built to the same length
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is Depends() in argument defaults, by design.
"app/api/**" = ["B008"]
"app/auth/**" = ["B008"]
# Imports follow a module-level constant the schema imports depend on.
"app/schemas/script_schema.py" = ["E402"]
"tests/**" = ["B008"]
